<style>

:root[data-theme="dark"]{--bg:#111a1d;--card:#1a272b;--ink:#e8efed;--mute:#97a8ab;--line:#2c3c41;--due:#ff7b66;--ok:#4fd1a5;--warn:#f0b050;--btn:#e8efed;--btnt:#111a1d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Hanken Grotesk",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px}

input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;margin-top:4px}
label{display:block;font-size:13px;color:var(--mute);margin-top:12px}
button{font:600 15px inherit;font-family:inherit;border:0;border-radius:8px;padding:11px 14px;background:var(--btn);color:var(--btnt);cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>button{flex:none}
.cust{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-top:10px;cursor:pointer}
.cust b{font-size:17px}.amt{font-weight:800;font-size:18px}
.bar{height:5px;border-radius:3px;background:var(--line);margin-top:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.sub{font-size:13px;color:var(--mute)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:430px;font-size:14px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}td.r,th.r{text-align:right}
.sale{color:var(--due)}.pay{color:var(--ok)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
#modal.on{display:flex}
#sheet{background:var(--bg);width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
#sheet h2{margin:0 0 4px;font-size:19px}
.err{color:var(--due);font-size:13px;margin-top:8px;min-height:18px}
.empty{padding:28px 10px;text-align:center;color:var(--mute)}
.wrap.wide{max-width:1320px}
#sheet.wide-sheet{max-width:720px}
.mreg-tbl table{min-width:1100px;font-size:12px;border-collapse:collapse;width:100%}
.mreg-tbl th{background:#fef08a;color:#713f12;text-align:center;border:1px solid #ca8a04;font-size:11px;padding:6px 6px;font-weight:700}
.mreg-tbl th.subhead{background:#fef9c3;font-weight:600;font-size:11px}
.mreg-tbl th.sum-ms{background:#dbeafe;color:#1e40af;border-color:#3b82f6}
.mreg-tbl th.sum-power{background:#fce7f3;color:#9d174d;border-color:#ec4899}
.mreg-tbl th.sum-hsd{background:#dcfce7;color:#166534;border-color:#22c55e}
.mreg-tbl td{border:1px solid var(--line);padding:5px 6px;text-align:center;font-size:12px}
.mreg-tbl td.sum-ms{background:rgba(59,130,246,0.08);font-weight:700;color:var(--ink);text-align:right}
.mreg-tbl td.sum-power{background:rgba(236,72,153,0.08);font-weight:700;color:var(--ink);text-align:right}
.mreg-tbl td.sum-hsd{background:rgba(34,197,94,0.08);font-weight:700;color:var(--ink);text-align:right}
.mreg-tbl td.sum-tot{background:rgba(0,0,0,0.05);font-weight:800;color:var(--ink);text-align:right}
.mreg-tbl tr:nth-child(even){background:rgba(0,0,0,0.015)}
.mreg-tbl tr:hover{background:rgba(234,179,8,0.06)}
.dreg-tbl table{min-width:960px;font-size:12px;border-collapse:collapse;width:100%}
.dreg-tbl th{background:#fef08a;color:#713f12;text-align:center;border:1px solid #ca8a04;font-size:11px;padding:6px 4px;font-weight:700}
.dreg-tbl th.subhead{background:#fef9c3;font-weight:600;font-size:10px}
.dreg-tbl td{border:1px solid var(--line);padding:5px 4px;text-align:center;font-size:12px}
.dreg-tbl tr:nth-child(even){background:rgba(0,0,0,0.015)}
.dreg-tbl tr.has-decant{background:rgba(234,179,8,0.08)}

  :root:not([data-theme="light"]) .mreg-tbl th.sum-ms{background:#1e3a8a;color:#93c5fd;border-color:#3b82f6}
  :root:not([data-theme="light"]) .mreg-tbl th.sum-power{background:#831843;color:#fbcfe8;border-color:#ec4899}
  :root:not([data-theme="light"]) .mreg-tbl th.sum-hsd{background:#14532d;color:#86efac;border-color:#22c55e}
  :root:not([data-theme="light"]) .mreg-tbl td.sum-ms{background:rgba(59,130,246,0.18)}
  :root:not([data-theme="light"]) .mreg-tbl td.sum-power{background:rgba(236,72,153,0.18)}
  :root:not([data-theme="light"]) .mreg-tbl td.sum-hsd{background:rgba(34,197,94,0.18)}
  :root:not([data-theme="light"]) .mreg-tbl td.sum-tot{background:rgba(255,255,255,0.08)}
  :root:not([data-theme="light"]) .dreg-tbl th{background:#854d0e;color:#fef08a;border-color:#a16207}
  :root:not([data-theme="light"]) .dreg-tbl th.subhead{background:#713f12;color:#fef9c3}

:root[data-theme="dark"] .mreg-tbl th.sum-hsd{background:#14532d;color:#86efac;border-color:#22c55e}
:root[data-theme="dark"] .mreg-tbl td.sum-ms{background:rgba(59,130,246,0.18)}
:root[data-theme="dark"] .mreg-tbl td.sum-power{background:rgba(236,72,153,0.18)}
:root[data-theme="dark"] .mreg-tbl td.sum-hsd{background:rgba(34,197,94,0.18)}
:root[data-theme="dark"] .mreg-tbl td.sum-tot{background:rgba(255,255,255,0.08)}
:root[data-theme="dark"] .dreg-tbl th{background:#854d0e;color:#fef08a;border-color:#a16207}
:root[data-theme="dark"] .dreg-tbl th.subhead{background:#713f12;color:#fef9c3}
:root[data-theme="dark"] .dreg-tbl tr.has-decant{background:rgba(234,179,8,0.15)}
@media print{
  @page{size:landscape;margin:8mm}
  .noprint,button{display:none!important}
  body{background:#fff;color:#000}
  .wrap.wide{max-width:100%!important;padding:0!important}
  .dreg-tbl table{width:100%!important;min-width:0!important;font-size:10px!important}
  .dreg-tbl th,.dreg-tbl td{padding:2px 2px!important;border-color:#333!important}

  .dreg-tbl th.subhead{background:#f5f5f5!important}
}
#bdg{display:none;position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;background:var(--due);color:#fff;padding:8px 12px;font-size:14px;z-index:9;text-align:center}
</style>

<body>

<div id="modal"><div id="sheet"></div></div>
<script>
var KEY="petrol-credit-ledger-v1",S,view=null,from="",to="",onlyDue=false,cb,tab="ledger",dr=null,iv=null,sv=null,bf="all",rf=today().slice(0,8)+"01",rt=today();
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}
var d=function(n){return new Date(Date.now()-n*864e5).toISOString().slice(0,10)};
return{c:[
{id:1,name:"Shree Transport",phone:"9876500011",gst:"27ABCDE1234F1Z5",veh:["MH12 AB 1234","MH12 CD 5678"],limit:50000,e:[{d:d(9),t:"sale",n:"HSD 300 L",a:28500},{d:d(5),t:"pay",n:"UPI",a:10000},{d:d(2),t:"sale",n:"HSD 150 L",a:14250}]},
{id:2,name:"Patil Agro Services",phone:"9876500022",gst:"",veh:["MH14 XY 9090"],limit:20000,e:[{d:d(6),t:"sale",n:"MS 100 L",a:10800},{d:d(3),t:"sale",n:"Power MS 60 L",a:7100}]},
{id:3,name:"City Cab Fleet",phone:"9876500033",gst:"27PQRST5678G1Z2",veh:[],limit:30000,e:[{d:d(4),t:"sale",n:"MS 200 L",a:21600},{d:d(1),t:"pay",n:"Cash",a:21600}]}]}}
function save(){if(!SRV){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}return}clearTimeout(saveT);saveT=setTimeout(push,400)}
function due(c){return c.e.reduce(function(s,x){return s+(x.t=="sale"?x.a:-x.a)},0)}
function inr(n){return "₹"+Math.round(n).toLocaleString("en-IN")}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function today(){return new Date().toISOString().slice(0,10)}
function find(id){return S.c.filter(function(c){return c.id==id})[0]}
function render(){if(tab=="inv")return renderInv();if(tab=="stock")return renderStock();if(tab=="sup")return renderSup();if(tab=="book")return renderBook();if(tab=="rep")return renderRep();if(tab=="bak")return renderBak();if(tab=="team")return renderTeam();if(tab=="credit")return renderCredit();if(tab=="duty")return renderDutyTab();if(tab=="tanks")return renderTanks();if(tab=="wdip")return loadDip();if(tab=="pay")return renderSalary();if(tab=="setup")return renderSetup();if(tab=="veh")return renderVeh();if(tab=="short")return renderShort();if(tab=="mypay")return loadMyPay();if(tab=="wduty")return loadW();var h="";
if(!view){var tot=S.c.reduce(function(s,c){return s+due(c)},0),q=(document.getElementById("q")||{}).value||"";
h+=nav()+pendHtml()+'<h1>Total credit outstanding</h1><div class="total">'+inr(tot)+'</div><div class="row"><input id="q" placeholder="Search name or vehicle" value="'+esc(q)+'" oninput="render();var i=document.getElementById(\'q\');i.focus();i.setSelectionRange(99,99)"><button onclick="custForm()">Add customer</button></div><button class="ghost" style="width:100%;margin-top:8px" onclick="bulkForm()">Send reminders to everyone with dues</button><button class="ghost" style="width:100%;margin-top:8px" onclick="renderVeh()">Vehicle-wise credit report</button><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto;margin:0" '+(onlyDue?'checked':'')+' onchange="onlyDue=this.checked;render()">Only customers with dues</label>';
var l=S.c.filter(function(c){var t=(c.name+c.veh.join(" ")).toLowerCase();return t.indexOf(q.toLowerCase())>-1&&(!onlyDue||due(c)>0)});
if(!l.length)h+='<div class="empty">No credit customers found. Add one to start a ledger.</div>';
l.forEach(function(c){var d=due(c),p=c.limit?Math.min(100,d/c.limit*100):0;
h+='<div class="cust" tabindex="0"'+(c.active===false?' style="opacity:.6"':'')+' onclick="view='+c.id+';render()" onkeydown="if(event.key==\'Enter\'){view='+c.id+';render()}"><div class="row"><b>'+esc(c.name)+(c.active===false?' (inactive)':'')+'</b><span class="amt" style="text-align:right;flex:none;color:'+(d>0?'var(--due)':'var(--ok)')+'">'+inr(d)+'</span></div><div class="sub">'+(c.veh.length?esc(c.veh.join(", ")):"No vehicles added")+'</div><div class="bar"><i style="width:'+p+'%;background:'+(p>=90?'var(--due)':p>=70?'var(--warn)':'var(--ok)')+'"></i></div><div class="sub" style="margin-top:4px">'+Math.round(p)+'% of '+inr(c.limit)+' limit used</div></div>'}
)}else{var c=find(view),d=due(c),bal=0;
h+='<button class="ghost noprint" onclick="view=null;render()">Back to customers</button><h1 style="margin-top:14px">'+esc(c.name)+'</h1><div class="total">'+inr(d)+'</div><div class="sub">Limit '+inr(c.limit)+' · Available '+inr(Math.max(0,c.limit-d))+'</div><div class="sub">'+esc(c.phone)+(c.gst?' · GST '+esc(c.gst):'')+'</div><div class="sub">Vehicles: '+(c.veh.length?esc(c.veh.join(", ")):"none added")+'</div>'+
'<div class="btns noprint"><button onclick="entryForm(\'sale\')">Add credit sale</button><button onclick="entryForm(\'pay\')">Receive payment</button><button class="ghost" onclick="remind()">Send WhatsApp reminder</button><button class="ghost" onclick="custForm('+c.id+')">Edit details</button><button class="ghost" onclick="window.print()">Print statement</button><button class="ghost" onclick="stmt()">Share text statement</button>'+xbtns()+'<button class="ghost" onclick="stmtPdfShare()">Send PDF on WhatsApp</button></div>';
XD=stmtDoc(c);h+=ageing(c)+'<div class="row noprint"><label>From<input type="date" value="'+from+'" onchange="from=this.value;render()"></label><label>To<input type="date" value="'+to+'" onchange="to=this.value;render()"></label></div>';
h+='<div class="tbl" style="margin-top:12px"><table><tr><th>Date</th><th>Detail</th><th class="r">Amount</th><th class="r">Balance</th><th class="noprint"></th></tr>';var n=0;
rows(c).forEach(function(o){var x=o.x;if(o.skip)return;n++;
h+='<tr><td>'+x.d.slice(5)+'</td><td>'+(x.t=="sale"?"Sale: ":"Paid: ")+esc(x.n)+'</td><td class="r '+x.t+'">'+(x.t=="sale"?"+":"\u2212")+inr(x.a)+'</td><td class="r">'+inr(o.bal)+'</td><td class="noprint" style="white-space:nowrap">'+(x.srv?'':'<button class="ghost" style="padding:5px 8px" onclick="entryForm(\''+x.t+'\','+o.i+')">Edit</button> ')+'<button class="ghost" style="padding:5px 8px" onclick="delEntry('+o.i+')">Delete</button></td></tr>'});
if(!n)h+='<tr><td colspan="5" class="empty">No entries in this range.</td></tr>';
h+='</table></div>'}
document.getElementById("app").innerHTML=h}
function openM(h, wide){var s=document.getElementById("sheet");s.innerHTML=h;if(wide)s.classList.add("wide-sheet");else s.classList.remove("wide-sheet");document.getElementById("modal").classList.add("on")}
function close(){document.getElementById("sheet").classList.remove("wide-sheet");document.getElementById("modal").classList.remove("on")}
document.getElementById("modal").onclick=function(e){if(e.target.id=="modal")close()};
function v(id){return document.getElementById(id).value.trim()}
function custForm(id){var c=id?find(id):{name:"",phone:"",gst:"",veh:[],limit:""};
openM('<h2>'+(id?'Edit customer':'Add credit customer')+'</h2><label>Name<input id="f1" value="'+esc(c.name)+'"></label><label>Phone (WhatsApp)<input id="f2" inputmode="tel" value="'+esc(c.phone)+'"></label><label>GST number (optional)<input id="f3" value="'+esc(c.gst)+'"></label><label>Vehicles, one per line (add the tank size in litres after a comma if known)<textarea id="f4" placeholder="MH12 AB 1234, 200&#10;MH14 XY 9090" style="width:100%;height:90px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:8px;font:inherit;margin-top:4px">'+esc(c.veh.map(function(x){return x+(c.vtank&&c.vtank[x]?", "+c.vtank[x]:"")}).join("\n"))+'</textarea></label><label>Credit limit (₹)<input id="f5" inputmode="numeric" value="'+esc(c.limit)+'"></label><div class="err" id="er"></div><div class="row"><button class="ghost" onclick="close()">Cancel</button><button onclick="saveCust('+(id||0)+')">Save customer</button></div>')}
function saveCust(id){var n=v("f1"),p=v("f2").replace(/\D/g,""),l=parseFloat(v("f5"));
var pv=parseVeh(document.getElementById("f4").value);if(!n)return er("Enter the customer name.");if(p.length<10)return er("Enter a 10-digit phone number.");if(!(l>0))return er("Enter a credit limit above zero.");
var o={name:n,phone:p,gst:v("f3").toUpperCase(),veh:pv.veh,vtank:pv.tank,limit:l};
if(id){Object.assign(find(id),o)}else{o.id=Date.now();o.e=[];S.c.push(o)}save();close();render()}
function er(m){document.getElementById("er").textContent=m}
function rows(c){var bal=0;return c.e.map(function(x,i){return{x:x,i:i}}).sort(function(p,q){return p.x.d<q.x.d?-1:1}).map(function(o){bal+=o.x.t=="sale"?o.x.a:-o.x.a;o.bal=bal;o.skip=(from&&o.x.d<from)||(to&&o.x.d>to);return o})}
function ageing(c){var paid=c.e.reduce(function(s,x){return s+(x.t=="pay"?x.a:0)},0),k=[0,0,0,0],now=Date.now(),L=["0-30 days","31-60","61-90","90+"];
c.e.filter(function(x){return x.t=="sale"}).sort(function(p,q){return p.d<q.d?-1:1}).forEach(function(x){var r=x.a,u=Math.min(paid,r);paid-=u;r-=u;if(r>0){var dy=Math.floor((now-new Date(x.d))/864e5);k[dy<=30?0:dy<=60?1:dy<=90?2:3]+=r}});
return '<div class="sub" style="margin-top:12px">Overdue ageing</div><div class="row" style="gap:6px">'+k.map(function(v,i){return '<div class="cust" style="margin:4px 0 0;padding:8px;cursor:default;text-align:center"><div class="sub">'+L[i]+'</div><b style="color:'+(i>1&&v>0?'var(--due)':'var(--ink)')+'">'+inr(v)+'</b></div>'}).join("")+'</div>'}
function ask(m,fn){cb=fn;openM('<h2>Please confirm</h2><div class="sub">'+esc(m)+'</div><div class="row" style="margin-top:14px"><button class="ghost" onclick="close()">Cancel</button><button onclick="close();cb()">Yes, continue</button></div>')}
function entryForm(t,i){var c=find(view),s=t=="sale",x=i!=null?c.e[i]:null;
openM('<h2>'+(x?'Edit ':'Add ')+(s?'credit sale':'payment')+'</h2><div class="sub">'+esc(c.name)+' \u00b7 Due '+inr(due(c))+'</div><label>Date<input id="f1" type="date" value="'+(x?x.d:today())+'"></label><label>'+(s?'Fuel / item and quantity<input id="f2" value="'+esc(x?x.n:"")+'" placeholder="e.g. HSD 200 L">':'Mode<select id="f2"><option>Cash</option><option>UPI</option><option>Bank transfer</option><option>Cheque</option></select>')+'</label><label>Amount (\u20b9)<input id="f3" inputmode="decimal" value="'+(x?x.a:"")+'"></label><div class="err" id="er"></div><div class="row"><button class="ghost" onclick="close()">Cancel</button><button onclick="saveEntry(\''+t+'\','+(i==null?'null':i)+')">Save</button></div>');
if(x&&!s)document.getElementById("f2").value=x.n}
function saveEntry(t,i){var c=find(view),a=parseFloat(v("f3")),old=i!=null?c.e[i]:null,cur=due(c)-(old?(old.t=="sale"?old.a:-old.a):0);
if(!(a>0))return er("Enter an amount above zero.");if(!v("f2"))return er("Enter the item and quantity.");
var o={d:v("f1"),t:t,n:v("f2"),a:a};
function go(){if(old)c.e[i]=o;else c.e.push(o);save();close();render()}
if(t=="sale"&&cur+a>c.limit)return ask("This sale takes "+c.name+" over the credit limit by "+inr(cur+a-c.limit)+". Save anyway?",go);

function delEntry(i){var c=find(view),x=c.e[i];ask("Delete the "+(x.t=="sale"?"sale":"payment")+" of "+inr(x.a)+" ("+x.n+")?",function(){if(x.srv){api("DELETE","/api/credit-sales/"+x.srv).then(function(){pullDuty(render)}).catch(function(e){badge(e.error||"Could not delete.")});return}c.e.splice(i,1);save();render()})}
function stmt(){var c=find(view),t="Statement for "+c.name+(from||to?" ("+(from||"start")+" to "+(to||"today")+")":"")+"\n";

function astm53B(fuel, obs, temp) {
  var o = parseFloat(obs), t = parseFloat(temp);
  if (isNaN(o) || isNaN(t) || o <= 0) return "";
  var isKg = o > 10;
  var d = isKg ? o : o * 1000;
  var isDiesel = /diesel|hsd/i.test(fuel || "");
  var factor = isDiesel ? 0.70 : 0.892;
  var d15 = d + factor * (t - 15);
  return isKg ? (Math.round(d15 * 10) / 10).toFixed(1) : (Math.round(d15) / 10000).toFixed(4);
}

function dregCalcMix() {
  var c1 = parseFloat(v("dr_c1")), c2 = parseFloat(v("dr_c2")), c3 = parseFloat(v("dr_c3")), c4 = parseFloat(v("dr_c4"));
  var arr = [c1, c2, c3, c4].filter(function(x) { return !isNaN(x) && x > 0; });
  var mixInput = document.getElementById("dr_mix");
  if (arr.length > 0 && mixInput && !mixInput.dataset.manual) {
    var avg = arr.reduce(function(a, b) { return a + b; }, 0) / arr.length;
    mixInput.value = (Math.round(avg * 10) / 10).toFixed(1);
  }
  dregCalcDiff();
}

function dregCalcDiff() {
  var mix = parseFloat(v("dr_mix")), ch = parseFloat(v("dr_ch_d15"));
  var diffEl = document.getElementById("dr_diff"), alertEl = document.getElementById("dr_diff_alert");
  if (!isNaN(mix) && !isNaN(ch)) {
    var diff = Math.round(Math.abs(mix - ch) * 10) / 10;
    if (diffEl) diffEl.value = diff.toFixed(1);
    if (alertEl) {
      if (diff > 3.0) {
        alertEl.style.color = "var(--due)";
        alertEl.textContent = "⚠️ Difference (" + diff.toFixed(1) + ") exceeds permissible limit of ±3.0 kg/m³!";
      } else {
        alertEl.style.color = "var(--ok)";
        alertEl.textContent = "✓ Difference (" + diff.toFixed(1) + ") is within permissible limit (±3.0 kg/m³).";
      }
    }
  }
}

function dregExportExcel() {
  var ym = DREG_MONTH.split("-"), yr = parseInt(ym[0]), mo = parseInt(ym[1]);
  var daysInMonth = new Date(yr, mo, 0).getDate();
  var d = xdoc("Density Register - " + DREG_FUEL, DREG_MONTH + (S.biz && S.biz.name ? " - " + S.biz.name : ""));

  var head = [
    "Date",
    "Morning Density",
    "Morning Temp (°C)",
    "Morning Density @ 15°C",
    "Compartment I",
    "Compartment II",
    "Compartment III",
    "Compartment IV",
    "Mix Compartment Density",
    "Density @ 15°C as per Challan",
    "Dif in Density",
    "Stock Before Receipt Dip (cm)",
    "Stock Before Receipt Stock (L)",
    "Density @ 15°C After Decant (100 L)",
    "Receipt KL",
    "Challan No"
  ];

  var rows = [];
  var fmt = function(v) { return v != null && v !== "" && !isNaN(v) ? Number(v).toFixed(1) : ""; };

  for (var day = 1; day <= daysInMonth; day++) {
    var dayStr = (day < 10 ? "0" : "") + day;
    var dIso = DREG_MONTH + "-" + dayStr;
    var dispD = day + "/" + mo + "/" + yr;
    var matches = DREG_ENTRIES.filter(function(x) { return x.d === dIso; });
    if (matches.length === 0) {
      rows.push([dispD, "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""]);
    } else {
      matches.forEach(function(e, mi) {
        rows.push([
          mi === 0 ? dispD : dispD + " (#2)",
          fmt(e.m_density),
          fmt(e.m_temp),
          fmt(e.m_d15),
          fmt(e.comp1),
          fmt(e.comp2),
          fmt(e.comp3),
          fmt(e.comp4),
          fmt(e.mix_density),
          fmt(e.challan_d15),
          fmt(e.diff_density),
          e.before_dip != null ? e.before_dip : "",
          e.before_stock != null ? Math.round(e.before_stock) : "",
          fmt(e.after_density),
          e.receipt_kl != null ? Number(e.receipt_kl).toFixed(1) : "",
          e.challan_no || ""
        ]);
      });
    }
  }

  xsec(d, DREG_FUEL + " Density Register", head, rows, "Density Register");
  var filename = ("Density-Register-" + DREG_FUEL + "-" + DREG_MONTH).replace(/[^A-Za-z0-9_-]+/g, "_");
  saveBytes(xlsxBytes(d), filename + ".xlsx", "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
}

function shortFuel(f) {
  if (!f) return "";
  if (/power/i.test(f)) return "POWER";
  if (/diesel|hsd/i.test(f)) return "HSD";
  if (/petrol|ms/i.test(f)) return "MS";
  return f;
}

function renderMeterReg() {
  var A = document.getElementById("app");
  var wrap = document.querySelector(".wrap");
  if (wrap) wrap.classList.add("wide");

  var ym = MREG_MONTH.split("-"), yr = parseInt(ym[0]), mo = parseInt(ym[1]);
  var daysInMonth = new Date(yr, mo, 0).getDate();

  var nozzles = (MREG_DATA && MREG_DATA.nozzles) || [];
  var dispNozzles = nozzles.filter(function(n) {
    return MREG_FILTER_FUEL === "All" || n.fuel === MREG_FILTER_FUEL;
  });

  var entries = (MREG_DATA && MREG_DATA.entries) || [];
  var byDate = {};
  entries.forEach(function(e) {
    if (!byDate[e.d]) byDate[e.d] = {};
    byDate[e.d][e.nozzle_id] = e;
  });

  // Calculate monthly summary totals
  var monthMs = 0, monthPower = 0, monthHsd = 0, monthOther = 0, monthGrandTotal = 0;
  var nozzleMonthTotals = {};
  var recordedDaysSet = {};

  for (var d = 1; d <= daysInMonth; d++) {
    var dStr = (d < 10 ? "0" : "") + d;
    var dIso = MREG_MONTH + "-" + dStr;
    var dayMap = byDate[dIso];
    if (!dayMap) continue;

    nozzles.forEach(function(n) {
      var e = dayMap[n.id];
      if (e && e.sale != null) {
        recordedDaysSet[dIso] = true;
        var s = Number(e.sale) || 0;
        nozzleMonthTotals[n.id] = (nozzleMonthTotals[n.id] || 0) + s;
        monthGrandTotal += s;
        var sf = shortFuel(n.fuel);
        if (sf === "MS") monthMs += s;
        else if (sf === "POWER") monthPower += s;
        else if (sf === "HSD") monthHsd += s;
        else monthOther += s;

        '<select onchange="MREG_FILTER_FUEL=this.value;renderMeterReg()" style="padding:6px 10px;font-size:13px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);margin:0">' +
          '<option value="All"' + (MREG_FILTER_FUEL === "All" ? ' selected' : '') + '>All Pump Nozzles</option>' +
          '<option value="Petrol (MS)"' + (MREG_FILTER_FUEL === "Petrol (MS)" ? ' selected' : '') + '>Petrol (MS)</option>' +
          '<option value="Diesel (HSD)"' + (MREG_FILTER_FUEL === "Diesel (HSD)" ? ' selected' : '') + '>Diesel (HSD)</option>' +
          '<option value="Power petrol"' + (MREG_FILTER_FUEL === "Power petrol" ? ' selected' : '') + '>Power petrol</option>' +
        '</select>' +

  // KPI Summary Bar
  h += '<div class="cust noprint" style="cursor:default;margin:0 0 14px;padding:12px 14px;background:var(--card);border:1px solid var(--line)">' +
    '<div class="row" style="flex-wrap:wrap;gap:14px;align-items:center">' +
      '<div style="border-left:3px solid #3b82f6;padding-left:8px">' +
        '<div class="sub" style="font-size:11px">Product Sale MS (Petrol)</div>' +
        '<b style="font-size:17px;color:#1d4ed8">' + (Math.round(monthMs * 10) / 10).toLocaleString("en-IN") + ' L</b>' +
      '</div>' +
      '<div style="border-left:3px solid #ec4899;padding-left:8px">' +
        '<div class="sub" style="font-size:11px">Product Sale Power</div>' +
        '<b style="font-size:17px;color:#be185d">' + (Math.round(monthPower * 10) / 10).toLocaleString("en-IN") + ' L</b>' +
      '</div>' +
      '<div style="border-left:3px solid #22c55e;padding-left:8px">' +
        '<div class="sub" style="font-size:11px">Product Sale HSD (Diesel)</div>' +
        '<b style="font-size:17px;color:#15803d">' + (Math.round(monthHsd * 10) / 10).toLocaleString("en-IN") + ' L</b>' +
      '</div>' +
      '<div style="border-left:3px solid var(--ink);padding-left:8px">' +
        '<div class="sub" style="font-size:11px">Total Fuel Dispensed</div>' +
        '<b style="font-size:17px;color:var(--ink)">' + (Math.round(monthGrandTotal * 10) / 10).toLocaleString("en-IN") + ' L</b>' +
      '</div>' +
      '<div style="margin-left:auto">' +
        '<span class="sub" style="font-size:11px">Days Recorded: </span>' +
        '<b style="font-size:14px">' + daysCount + ' / ' + daysInMonth + '</b>' +
      '</div>' +
    '</div>' +
  '</div>';

  // Print Header
  h += '<div style="display:none;margin-bottom:10px" class="print-only">' +
    '<h2 style="margin:0;font-size:18px;text-align:center">' + esc(S.biz && S.biz.name ? S.biz.name : "PETROL PUMP") + ' - DAILY METER REGISTER</h2>' +
    '<div style="text-align:center;font-size:12px;color:var(--mute)">Daily Closing Meter Readings & Product Sales · Month: <b>' + MREG_MONTH + '</b></div>' +
  '</div>';

  // Google Sheets Style Meter Table
  h += '<div style="background:#fef08a;color:#713f12;padding:8px 12px;border:1px solid #ca8a04;border-bottom:none;border-radius:8px 8px 0 0;display:flex;justify-content:space-between;align-items:center">' +
    '<b style="font-size:14px;letter-spacing:0.5px">Meter (DailySale Register)</b>' +
    '<span style="font-size:11px;font-weight:600">Month: ' + MREG_MONTH + ' · ' + dispNozzles.length + ' Dispensing Units</span>' +
  '</div>';

  h += '<div class="tbl mreg-tbl" style="margin-top:0">' +
    '<table>' +
      '<thead>' +
        '<tr>' +
          '<th rowspan="2" style="min-width:65px">Date</th>' +
          (dispNozzles.length > 0 ? '<th colspan="' + dispNozzles.length + '">Product / Pump No (Dispensing Unit Closing Meters)</th>' : '') +
          '<th rowspan="2" class="sum-ms" style="min-width:90px">Product Sale<br>by Meter MS</th>' +
          '<th rowspan="2" class="sum-power" style="min-width:90px">Product Sale<br>by Meter Power</th>' +
          '<th rowspan="2" class="sum-hsd" style="min-width:90px">Product Sale<br>by Meter HSD</th>' +
          '<th rowspan="2" style="min-width:90px">Total Sale<br>by Meter (L)</th>' +
          '<th rowspan="2" class="noprint" style="min-width:60px">Action</th>' +
        '</tr>' +
        '<tr>';

  dispNozzles.forEach(function(n) {
    var sf = shortFuel(n.fuel);
    var color = sf === "MS" ? "#1e40af" : sf === "POWER" ? "#9d174d" : sf === "HSD" ? "#166534" : "#713f12";
    h += '<th class="subhead" style="min-width:85px">' +
      '<div style="font-size:10px;color:' + color + ';font-weight:700">' + esc(n.fuel) + '</div>' +
      '<div>' + esc(n.name) + '</div>' +
    '</th>';
  });

  h += '</tr>' +
      '</thead>' +
      '<tbody>';

  var fmt = function(v) {
    if (v == null || v === "" || isNaN(v)) return "";
    return Number(v).toLocaleString("en-IN", { minimumFractionDigits: 1, maximumFractionDigits: 2 });
  };
  var fmtInt = function(v) {
    if (v == null || v === "" || isNaN(v)) return "";
    return Math.round(Number(v)).toLocaleString("en-IN");
  };

  for (var day = 1; day <= daysInMonth; day++) {
    var dayStr = (day < 10 ? "0" : "") + day;
    var dIso = MREG_MONTH + "-" + dayStr;
    var dispD = day + "/" + (mo < 10 ? "0" + mo : mo) + "/" + yr;
    var dayMap = byDate[dIso] || {};

    var dayMs = 0, dayPwr = 0, dayHsd = 0, dayTot = 0, dayHasAny = false;
    nozzles.forEach(function(n) {
      var e = dayMap[n.id];
      if (e && e.sale != null) {
        dayHasAny = true;
        var s = Number(e.sale) || 0;
        dayTot += s;
        var sf = shortFuel(n.fuel);
        if (sf === "MS") dayMs += s;
        else if (sf === "POWER") dayPwr += s;
        else if (sf === "HSD") dayHsd += s;

      var e = dayMap[n.id];
      if (e && e.closing != null) {

        h += '<td>' +
          '<b>' + fmt(e.closing) + '</b>' +
          '<div style="font-size:10px;color:var(--mute)">Op: ' + opStr + (saleStr ? ' · ' + saleStr : '') + '</div>' +
        '</td>';
      } else {
        h += '<td style="color:var(--mute)">-</td>';
      }
    });

    h += '<td class="sum-ms">' + (dayHasAny ? fmtInt(dayMs) : '-') + '</td>' +
      '<td class="sum-power">' + (dayHasAny ? fmtInt(dayPwr) : '-') + '</td>' +
      '<td class="sum-hsd">' + (dayHasAny ? fmtInt(dayHsd) : '-') + '</td>' +
      '<td class="sum-tot">' + (dayHasAny ? '<b>' + fmtInt(dayTot) + '</b>' : '-') + '</td>' +

    '<tfoot>' +

        '<td><b>TOTAL</b></td>';

  dispNozzles.forEach(function(n) {
    var tot = nozzleMonthTotals[n.id] || 0;
    h += '<td><b>' + (tot > 0 ? fmtInt(tot) + ' L' : '-') + '</b></td>';
  });

  h += '<td class="sum-ms" style="font-size:13px"><b>' + fmtInt(monthMs) + ' L</b></td>' +
    '<td class="sum-power" style="font-size:13px"><b>' + fmtInt(monthPower) + ' L</b></td>' +
    '<td class="sum-hsd" style="font-size:13px"><b>' + fmtInt(monthHsd) + ' L</b></td>' +
    '<td class="sum-tot" style="font-size:13px"><b>' + fmtInt(monthGrandTotal) + ' L</b></td>' +
    '<td class="noprint"></td>' +
  '</tr>' +
  '</tfoot>' +
  '</table></div>';

  A.innerHTML = h;
}

function mregShiftMonth(dir) {
  var ym = MREG_MONTH.split("-"), yr = parseInt(ym[0]), mo = parseInt(ym[1]);
  mo += dir;
  if (mo < 1) { mo = 12; yr--; }
  else if (mo > 12) { mo = 1; yr++; }
  MREG_MONTH = yr + "-" + (mo < 10 ? "0" + mo : mo);
  loadMeterReg();
}

  var d = dateStr || today();

  if (!nozzles.length) {

  }

  var existingMap = {};
  entries.filter(function(e) { return e.d === d; }).forEach(function(e) {
    existingMap[e.nozzle_id] = e;
  });

  // Fetch opening readings for each nozzle (closing of previous night shift)

    var openings = (res && res.openings) || {};
    var isExisting = Object.keys(existingMap).length > 0;

    var rowsHtml = "";

      var exist = existingMap[n.id];
      var opData = openings[n.id] || {};
      var openVal = exist && exist.opening != null ? exist.opening : (opData.opening != null ? opData.opening : (n.open ?? ""));
      var closeVal = exist && exist.closing != null ? exist.closing : "";
      var testVal = exist && exist.testing != null ? exist.testing : "0";
      var saleVal = exist && exist.sale != null ? exist.sale : "";

      var sf = shortFuel(n.fuel);
      var color = sf === "MS" ? "#1e40af" : sf === "POWER" ? "#9d174d" : sf === "HSD" ? "#166534" : "#713f12";

      rowsHtml += '<div style="background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px">' +
        '<div class="row" style="justify-content:space-between;align-items:center;margin-bottom:8px">' +
          '<div class="row" style="align-items:center;gap:6px">' +
            '<b style="font-size:15px">' + esc(n.name) + '</b>' +
            '<span style="background:' + bg + ';color:' + color + ';font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px">' + esc(n.fuel) + '</span>' +
          '</div>' +
          '<span class="sub" style="font-size:11px">' + esc(sourceLabel) + '</span>' +
        '</div>' +
        '<div class="row" style="gap:8px;align-items:flex-end">' +
          '<label style="flex:1;margin:0">Opening (Morning)' +
            '<input id="mop_' + idx + '" data-nid="' + n.id + '" inputmode="decimal" value="' + esc(openVal) + '" oninput="mregCalcSale(' + idx + ')" placeholder="0.00">' +
          '</label>' +
          '<label style="flex:1;margin:0">Closing (Night Shift End)' +
            '<input id="mcl_' + idx + '" data-nid="' + n.id + '" inputmode="decimal" value="' + esc(closeVal) + '" oninput="mregCalcSale(' + idx + ')" placeholder="0.00">' +
          '</label>' +
          '<label style="width:85px;margin:0">Testing (L)' +
            '<input id="mts_' + idx + '" data-nid="' + n.id + '" inputmode="decimal" value="' + esc(testVal) + '" oninput="mregCalcSale(' + idx + ')">' +
          '</label>' +
          '<div style="width:110px;text-align:right">' +
            '<div class="sub" style="font-size:11px">Day Sale</div>' +
            '<b id="msl_' + idx + '" style="font-size:16px;color:var(--ok)">' + (saleVal !== "" ? Number(saleVal).toLocaleString("en-IN") + " L" : "-") + '</b>' +
          '</div>' +
        '</div>' +
      '</div>';
    });

    var h = '<div class="row" style="justify-content:space-between;align-items:center;margin-bottom:6px">' +
        '<h2 style="margin:0">Daily Meter Reading (Totalizer)</h2>' +
        (isExisting ? '<button class="ghost" style="color:var(--due);padding:4px 8px;font-size:12px" onclick="mregDeleteDay(\'' + d + '\')">Delete Day</button>' : '') +
      '</div>' +
      '<div class="sub" style="margin-bottom:12px">Recorded daily at pump closing. Morning opening is automatically taken from previous night shift closing.</div>' +
      '<div class="row" style="gap:8px;align-items:center;background:#fef9c3;color:#854d0e;border:1px solid #ca8a04;padding:8px 12px;border-radius:6px;margin-bottom:12px;font-size:12px">' +
        '<span>🌅 <b>Night Shift Rollover</b>: Closing meter from the night shift becomes opening meter for the morning shift.</span>' +
      '</div>' +

    openM(h, true);

function mregCalcSale(idx) {
  var op = parseFloat(v("mop_" + idx));
  var cl = parseFloat(v("mcl_" + idx));
  var ts = parseFloat(v("mts_" + idx)) || 0;
  var outEl = document.getElementById("msl_" + idx);
  if (!isNaN(cl) && !isNaN(op)) {
    var sale = Math.max(0, cl - op - ts);
    outEl.textContent = (Math.round(sale * 10) / 10).toLocaleString("en-IN") + " L";
  } else {
    outEl.textContent = "-";
  }
  mregRecalcAllModal();
}

function mregRecalcAllModal() {
  var nozzles = (MREG_DATA && MREG_DATA.nozzles) || [];
  var ms = 0, pwr = 0, hsd = 0, tot = 0;
  nozzles.forEach(function(n, idx) {
    var op = parseFloat(v("mop_" + idx));
    var cl = parseFloat(v("mcl_" + idx));
    var ts = parseFloat(v("mts_" + idx)) || 0;
    if (!isNaN(cl) && !isNaN(op)) {
      var sale = Math.max(0, cl - op - ts);
      tot += sale;
      var sf = shortFuel(n.fuel);
      if (sf === "MS") ms += sale;
      else if (sf === "POWER") pwr += sale;
      else if (sf === "HSD") hsd += sale;
    }
  });

  var elMs = document.getElementById("mreg_tally_ms");
  var elPwr = document.getElementById("mreg_tally_power");
  var elHsd = document.getElementById("mreg_tally_hsd");
  var elTot = document.getElementById("mreg_tally_tot");
  if (elMs) elMs.textContent = "MS: " + (Math.round(ms * 10) / 10).toLocaleString("en-IN") + " L";
  if (elPwr) elPwr.textContent = "Power: " + (Math.round(pwr * 10) / 10).toLocaleString("en-IN") + " L";
  if (elHsd) elHsd.textContent = "HSD: " + (Math.round(hsd * 10) / 10).toLocaleString("en-IN") + " L";
  if (elTot) elTot.textContent = "Total: " + (Math.round(tot * 10) / 10).toLocaleString("en-IN") + " L";
}

function mregSaveDay(dateStr) {
  var d = v("mreg_date") || dateStr;
  var nozzles = (MREG_DATA && MREG_DATA.nozzles) || [];
  var readings = [];

  for (var i = 0; i < nozzles.length; i++) {
    var n = nozzles[i];
    var opStr = v("mop_" + i);
    var clStr = v("mcl_" + i);
    var tsStr = v("mts_" + i);

    if (clStr !== "" && opStr !== "") {
      var op = parseFloat(opStr);
      var cl = parseFloat(clStr);
      var ts = parseFloat(tsStr) || 0;
      if (isNaN(op) || isNaN(cl)) return er("Check the numbers entered for " + n.name);
      if (cl < op) return er("Closing reading cannot be less than opening reading for " + n.name);
      readings.push({
        nozzle_id: n.id,
        opening: op,
        closing: cl,
        testing: ts
      });
    } else if (opStr !== "") {
      readings.push({
        nozzle_id: n.id,
        opening: parseFloat(opStr),
        closing: null,
        testing: 0
      });
    }
  }

  if (readings.length === 0) return er("Enter meter readings for at least one nozzle.");

  api("POST", "/api/meter-register", { d: d, readings: readings }).then(function() {
    close();
    toast("Daily meter readings saved for " + d);
    loadMeterReg();
  }).catch(function(e) {
    er(e.error || "Could not save readings.");
  });
}

function mregDeleteDay(d) {
  ask("Delete all meter readings for " + d + "?", function() {
    api("DELETE", "/api/meter-register/" + d).then(function() {
      close();
      toast("Readings deleted for " + d);
      loadMeterReg();
    }).catch(function(e) {
      badge(e.error || "Could not delete readings.");
    });
  });
}

function mregAutoSyncDate(d) {
  api("POST", "/api/meter-register/sync-from-duties", { d: d }).then(function(res) {
    toast("Synced " + res.synced + " nozzle readings from closed duties!");
    mregDayModal(d);
  }).catch(function(e) {
    badge(e.error || "No closed duties found for " + d);

}

function mregSyncDutiesModal() {

    '<label>Date to sync' +

function mregDoSyncDuties() {

function mregExportExcel() {
  var ym = MREG_MONTH.split("-"), yr = parseInt(ym[0]), mo = parseInt(ym[1]);
  var daysInMonth = new Date(yr, mo, 0).getDate();
  var d = xdoc("Meter Register", MREG_MONTH + (S.biz && S.biz.name ? " - " + S.biz.name : ""));

  var nozzles = (MREG_DATA && MREG_DATA.nozzles) || [];
  var entries = (MREG_DATA && MREG_DATA.entries) || [];
  var byDate = {};
  entries.forEach(function(e) {
    if (!byDate[e.d]) byDate[e.d] = {};
    byDate[e.d][e.nozzle_id] = e;
  });

  var head = ["Date"];
  nozzles.forEach(function(n) {
    head.push(n.fuel + " (" + n.name + ")");
  });
  head.push("Product Sale by Meter MS");
  head.push("Product Sale by Meter Power");
  head.push("Product Sale by Meter HSD");
  head.push("Total Sale by Meter (L)");

  var rows = [];
  var fmtNum = function(v) { return v != null && v !== "" && !isNaN(v) ? Number(v) : ""; };

  for (var day = 1; day <= daysInMonth; day++) {
    var dayStr = (day < 10 ? "0" : "") + day;
    var dIso = MREG_MONTH + "-" + dayStr;
    var dispD = day + "/" + (mo < 10 ? "0" + mo : mo) + "/" + yr;
    var dayMap = byDate[dIso] || {};

    var r = [dispD];
    var dayMs = 0, dayPwr = 0, dayHsd = 0, dayTot = 0, hasAny = false;

    nozzles.forEach(function(n) {
      var e = dayMap[n.id];
      if (e && e.closing != null) {
        hasAny = true;
        r.push(fmtNum(e.closing));
        var s = Number(e.sale) || 0;
        dayTot += s;
        var sf = shortFuel(n.fuel);
        if (sf === "MS") dayMs += s;
        else if (sf === "POWER") dayPwr += s;
        else if (sf === "HSD") dayHsd += s;
      } else {
        r.push("");
      }
    });

    r.push(hasAny ? Math.round(dayMs * 10) / 10 : "");
    r.push(hasAny ? Math.round(dayPwr * 10) / 10 : "");
    r.push(hasAny ? Math.round(dayHsd * 10) / 10 : "");
    r.push(hasAny ? Math.round(dayTot * 10) / 10 : "");
    rows.push(r);
  }

  xsec(d, "Meter Register", head, rows, "Meter");
  var filename = ("DailySale-Meter-Register-" + MREG_MONTH).replace(/[^A-Za-z0-9_-]+/g, "_");
  saveBytes(xlsxBytes(d), filename + ".xlsx", "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
}

function mregSeedSample() {

      MREG_MONTH = "2025-05";
      loadMeterReg();
      toast("May 2025 Google Sheet meter register loaded (" + res.count + " days)!");
    }).catch(function(e) {

  });
}

var SREG_MONTH = today().slice(0, 7);
var SREG_FUEL = "Petrol (MS)";
var SREG_DATA = null;

function sregShiftMonth(dir) {
  var ym = SREG_MONTH.split("-"), yr = parseInt(ym[0]), mo = parseInt(ym[1]);
  mo += dir;
  if (mo < 1) { mo = 12; yr--; }
  if (mo > 12) { mo = 1; yr++; }
  SREG_MONTH = yr + "-" + (mo < 10 ? "0" + mo : mo);
  loadStockReg();
}

function loadStockReg() {
  TK_SUB = "stockreg";
  var A = document.getElementById("app");
  var wrap = document.querySelector(".wrap");
  if (wrap) wrap.classList.add("wide");
  A.innerHTML = nav() + '<div class="empty">Loading daily stock register\u2026</div>';
  api("GET", "/api/stock-register?month=" + SREG_MONTH + "&fuel=" + encodeURIComponent(SREG_FUEL)).then(function(d) {
    SREG_DATA = d;
    if (d.fuel) SREG_FUEL = d.fuel;
    renderStockReg();
  }).catch(function(e) {
    badge(e.error || "Could not load daily stock register.");
    renderStockReg();
  });
}

function renderStockReg() {
  var A = document.getElementById("app");
  var wrap = document.querySelector(".wrap");
  if (wrap) wrap.classList.add("wide");

  var ym = SREG_MONTH.split("-"), yr = parseInt(ym[0]), mo = parseInt(ym[1]);
  var daysInMonth = new Date(yr, mo, 0).getDate();

  var fuels = (SREG_DATA && SREG_DATA.fuels) || fuelNames();
  if (fuels.length === 0) fuels = ["Petrol (MS)", "Diesel (HSD)", "Power petrol"];
  if (fuels.indexOf(SREG_FUEL) < 0 && fuels.length > 0) SREG_FUEL = fuels[0];

  var entries = (SREG_DATA && SREG_DATA.entries) || [];
  var byDate = {};
  entries.forEach(function(e) { byDate[e.d] = e; });

  var linked = (SREG_DATA && SREG_DATA.linked) || {};
  var delivs = linked.deliveries || {};
  var meterSales = linked.meterSales || {};
  var dutySales = linked.dutySales || {};
  var dips = linked.dips || {};
  var tank = (SREG_DATA && SREG_DATA.tank) || null;

  // Compute month totals and cumulative values
  var totReceipts = 0, totDipSales = 0, totMeterSales = 0, totTesting = 0;
  var cumVariation = 0, cumSales = 0;
  var firstOpening = null, lastClosing = null;
  var recordedDaysCount = 0;

  var computedRows = [];
  var carryOpeningStock = null;
  var carryOpeningDip = null;

  for (var day = 1; day <= daysInMonth; day++) {
    var dayStr = (day < 10 ? "0" : "") + day;
    var dIso = SREG_MONTH + "-" + dayStr;
    var dt = new Date(yr, mo - 1, day);
    var dayName = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dt.getDay()];
    var dispD = dayStr + "/" + (mo < 10 ? "0" + mo : mo) + " " + dayName;

    var e = byDate[dIso] || null;
    var dv = delivs[dIso] || null;
    var ms = meterSales[dIso] || null;
    var ds = dutySales[dIso] || null;
    var dp = dips[dIso] || null;

    var hasRecord = !!e;
    if (hasRecord) recordedDaysCount++;

    // Opening dip & stock
    var opDip = (e && e.opening_dip != null) ? e.opening_dip : (carryOpeningDip != null ? carryOpeningDip : (dp ? dp.dip : null));
    var opStock = (e && e.opening_stock != null) ? e.opening_stock : (carryOpeningStock != null ? carryOpeningStock : (dp ? dp.litres : null));
    if (opStock != null && firstOpening == null) firstOpening = opStock;

    // Receipt
    var rec = (e && e.receipt != null && e.receipt > 0) ? e.receipt : (dv ? dv.litres : 0);
    var challan = (e && e.challan_no) ? e.challan_no : (dv ? dv.billno : "");
    if (rec > 0) totReceipts += rec;

    // Total available stock
    var totStock = opStock != null ? Math.round((opStock + rec) * 10) / 10 : null;

    // Closing dip & stock
    var clDip = (e && e.closing_dip != null) ? e.closing_dip : null;
    var clStock = (e && e.closing_stock != null) ? e.closing_stock : null;

    // Check next day for carried closing
    if (clStock == null && day < daysInMonth) {
      var nextDayStr = (day + 1 < 10 ? "0" : "") + (day + 1);
      var nextDIso = SREG_MONTH + "-" + nextDayStr;
      var nextE = byDate[nextDIso];
      if (nextE && nextE.opening_stock != null) {
        clStock = nextE.opening_stock;
        clDip = nextE.opening_dip;
      }
    }
    if (clStock != null) lastClosing = clStock;

    // Sales by dip
    var sDip = (e && e.sales_dip != null) ? e.sales_dip : (totStock != null && clStock != null ? Math.round((totStock - clStock) * 10) / 10 : null);
    if (sDip != null && (hasRecord || clStock != null)) totDipSales += sDip;

    // Sales by meter & testing
    var sMeter = (e && e.sales_meter != null) ? e.sales_meter : (ms && ms.sale != null ? ms.sale : (ds && ds.sale != null ? ds.sale : null));
    var sTest = (e && e.testing != null) ? e.testing : (ms && ms.testing != null ? ms.testing : (ds && ds.testing != null ? ds.testing : 0));
    if (sMeter != null) {
      totMeterSales += sMeter;
      cumSales += sMeter;
    }
    if (sTest != null) totTesting += sTest;

    // Book stock
    var bStock = (e && e.book_stock != null) ? e.book_stock : (totStock != null && sMeter != null ? Math.round((totStock - sMeter) * 10) / 10 : null);

    // Daily variation: Meter Sales - Dip Sales (or Closing Physical - Book Closing)
    var dVar = (e && e.variation != null) ? e.variation : (sMeter != null && sDip != null ? Math.round((sMeter - sDip) * 10) / 10 : (clStock != null && bStock != null ? Math.round((clStock - bStock) * 10) / 10 : null));
    if (dVar != null && (hasRecord || (clStock != null && sMeter != null))) {
      cumVariation += dVar;
    }

    // Set carry for next day
    carryOpeningStock = clStock;
    carryOpeningDip = clDip;

    computedRows.push({
      day: day,
      dIso: dIso,
      dispD: dispD,
      hasRecord: hasRecord,
      id: e ? e.id : null,
      opDip: opDip,
      opStock: opStock,
      rec: rec,
      challan: challan,
      totStock: totStock,
      clDip: clDip,
      clStock: clStock,
      sDip: sDip,
      sMeter: sMeter,
      sTest: sTest,
      bStock: bStock,
      dVar: dVar,
      cumVar: dVar != null ? Math.round(cumVariation * 10) / 10 : null,
      cumSales: cumSales > 0 ? Math.round(cumSales * 10) / 10 : null,
      note: (e && e.note) ? e.note : ""
    });
  }

  // Variations & permissible limit calculations
  cumVariation = Math.round(cumVariation * 10) / 10;
  totReceipts = Math.round(totReceipts * 10) / 10;
  totDipSales = Math.round(totDipSales * 10) / 10;
  totMeterSales = Math.round(totMeterSales * 10) / 10;
  totTesting = Math.round(totTesting * 10) / 10;

  var varPct = totMeterSales > 0 ? (cumVariation / totMeterSales * 100) : 0;
  var varPctStr = (varPct >= 0 ? "+" : "") + varPct.toFixed(2) + "%";
  var isHSD = /diesel|hsd/i.test(SREG_FUEL);
  var permLimit = isHSD ? 0.25 : 0.59; // Oil company standard: 0.59% for MS, 0.25% for HSD
  var withinNorm = Math.abs(varPct) <= permLimit;

  var h = nav() +
    '<div class="row noprint" style="gap:6px;margin-bottom:12px">' +
      '<button style="flex:1;padding:8px" class="ghost" onclick="TK_SUB=\'stock\';var w=document.querySelector(\'.wrap\');if(w)w.classList.remove(\'wide\');renderTanks()">Tank Stock & Dips</button>' +
      '<button style="flex:1;padding:8px" class="" onclick="loadStockReg()">Daily Stock Register</button>' +

    '<div class="row noprint" style="justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:12px">' +
      '<div>' +

          '<span style="background:#dbeafe;color:#1e40af;border:1px solid #93c5fd;font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px">Form 13 / OMC Norms</span>' +
        '</div>' +
        '<div class="sub">Daily morning dip opening stock, tanker receipts, pump meter sales, physical closing & daily operating variation</div>' +
      '</div>' +

        (entries.length === 0 ? '<button class="ghost" style="background:#fef9c3;color:#854d0e;border-color:#ca8a04" onclick="stockRegSeedSample()">Load Sample (Jan 2026 - MS)</button>' : '') +
      '</div>' +
    '</div>' +

    '<div class="row noprint" style="gap:8px;margin-bottom:14px;background:var(--card);padding:10px;border-radius:8px;border:1px solid var(--line);align-items:center;flex-wrap:wrap">' +
      '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">' +

          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>' +
          'Daily Meter Register' +
        '</button>' +
      '</div>' +
      '<div style="margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap">' +
        '<button class="ghost" style="padding:6px 10px;font-size:13px" onclick="sregShiftMonth(-1)" title="Previous Month">&lt; Prev</button>' +
        '<input type="month" value="' + SREG_MONTH + '" onchange="SREG_MONTH=this.value;loadStockReg()" style="padding:6px 10px;font-size:13px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)">' +
        '<button class="ghost" style="padding:6px 10px;font-size:13px" onclick="sregShiftMonth(1)" title="Next Month">Next &gt;</button>' +
        (tank ? '<span class="sub" style="margin-left:8px;font-weight:600;color:var(--ink)">Tank: ' + esc(tank.name) + ' (' + lt(tank.capacity) + ' L)</span>' : '') +
      '</div>' +
    '</div>';

  // KPI Summary Cards
  h += '<div class="row noprint" style="gap:10px;margin-bottom:14px;flex-wrap:wrap">' +
    '<div style="flex:1;min-width:140px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px">' +
      '<div class="sub" style="font-size:11px;text-transform:uppercase">Opening Stock (1st)</div>' +
      '<div style="font-size:18px;font-weight:800;color:var(--ink);margin-top:2px">' + (firstOpening != null ? lt(firstOpening) + ' L' : '—') + '</div>' +
      '<div class="sub" style="font-size:11px">Carried forward</div>' +
    '</div>' +
    '<div style="flex:1;min-width:140px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px">' +
      '<div class="sub" style="font-size:11px;text-transform:uppercase">Total Receipts</div>' +
      '<div style="font-size:18px;font-weight:800;color:var(--ink);margin-top:2px">' + (totReceipts > 0 ? lt(totReceipts) + ' L' : '0 L') + '</div>' +
      '<div class="sub" style="font-size:11px">' + (totReceipts > 0 ? (totReceipts / 1000).toFixed(2) + ' KL' : 'No TT receipts') + '</div>' +
    '</div>' +
    '<div style="flex:1;min-width:140px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px">' +
      '<div class="sub" style="font-size:11px;text-transform:uppercase">Meter Sales (Pump)</div>' +
      '<div style="font-size:18px;font-weight:800;color:var(--ink);margin-top:2px">' + (totMeterSales > 0 ? lt(totMeterSales) + ' L' : '0 L') + '</div>' +

    '</div>' +
    '<div style="flex:1;min-width:140px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px">' +
      '<div class="sub" style="font-size:11px;text-transform:uppercase">Dip Sales (Actual)</div>' +

    '<div style="flex:1.2;min-width:160px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px">' +
      '<div class="sub" style="font-size:11px;text-transform:uppercase">Net Variation (Loss / Gain)</div>' +
      '<div style="font-size:18px;font-weight:800;color:' + (cumVariation < 0 ? 'var(--due)' : 'var(--ok)') + ';margin-top:2px">' +
        (cumVariation > 0 ? '+' : '') + lt(cumVariation) + ' L (' + varPctStr + ')' +
      '</div>' +
      '<div style="font-size:11px;margin-top:2px">' +
        (withinNorm ? '<span style="color:var(--ok);font-weight:700">\u2713 Within OMC Norm (\u00b1' + permLimit + '%)</span>' : '<span style="color:var(--due);font-weight:700">\u26a0 Exceeds Norm (\u00b1' + permLimit + '%)</span>') +
      '</div>' +
    '</div>' +
  '</div>';

  // Print Header
  h += '<div style="display:none;margin-bottom:12px" class="print-only">' +
    '<h2 style="margin:0;font-size:18px;text-align:center">' + esc(S.biz && S.biz.name ? S.biz.name : "PETROL PUMP") + '</h2>' +
    '<h3 style="margin:2px 0 0;font-size:14px;text-align:center">PETROLEUM PRODUCT DAILY STOCK & SALES REGISTER (FORM 13)</h3>' +
    '<div style="text-align:center;font-size:12px;color:var(--mute);margin-top:4px">Product: <b>' + esc(SREG_FUEL) + '</b> · Month: <b>' + SREG_MONTH + '</b> · Tank Capacity: <b>' + (tank ? lt(tank.capacity) + ' L' : '—') + '</b></div>' +
  '</div>';

  // Table
  h += '<div class="tbl" style="max-height:72vh;overflow-y:auto;border:1px solid var(--line);border-radius:8px">' +
    '<table style="min-width:1220px;font-size:12px;border-collapse:collapse;width:100%">' +
      '<thead>' +
        '<tr style="background:var(--card);position:sticky;top:0;z-index:2;border-bottom:2px solid var(--line)">' +
          '<th style="padding:8px 6px;text-align:left;min-width:90px">Date</th>' +
          '<th style="padding:8px 6px;text-align:right;min-width:75px">Opening<br>Dip (cm)</th>' +
          '<th style="padding:8px 6px;text-align:right;min-width:85px;background:rgba(219,234,254,0.3)">Opening<br>Stock (L)</th>' +
          '<th style="padding:8px 6px;text-align:right;min-width:85px">Receipt<br>(L)</th>' +
          '<th style="padding:8px 6px;text-align:right;min-width:90px;font-weight:800">Total Stock<br>Avail (L)</th>' +
          '<th style="padding:8px 6px;text-align:right;min-width:75px">Closing<br>Dip (cm)</th>' +
          '<th style="padding:8px 6px;text-align:right;min-width:85px;background:rgba(219,234,254,0.3)">Closing<br>Stock (L)</th>' +
          '<th style="padding:8px 6px;text-align:right;min-width:85px">Sales by<br>Dip (L)</th>' +
          '<th style="padding:8px 6px;text-align:right;min-width:85px;background:rgba(254,249,195,0.4)">Sales by<br>Meter (L)</th>' +
          '<th style="padding:8px 6px;text-align:right;min-width:65px">Testing<br>(L)</th>' +
          '<th style="padding:8px 6px;text-align:right;min-width:85px">Book Stock<br>(Expected)</th>' +
          '<th style="padding:8px 6px;text-align:right;min-width:85px;font-weight:800">Daily Var<br>(Loss/Gain)</th>' +

        '</tr>' +
      '</thead>' +
      '<tbody>';

  computedRows.forEach(function(r) {
    var isToday = r.dIso === today();
    var hasData = r.hasRecord || r.opStock != null || r.rec > 0 || r.sMeter != null;
    var rowBg = isToday ? 'background:rgba(254,240,138,0.15);' : (r.day % 2 === 0 ? 'background:rgba(0,0,0,0.015);' : '');

    var varColor = "var(--ink)";

      '<td style="padding:6px;font-size:11px;color:var(--mute);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(r.note || r.challan) + '">' +
        (r.challan ? '<span style="background:#e0f2fe;color:#0369a1;padding:1px 4px;border-radius:3px;font-size:10px;font-weight:700">' + esc(r.challan) + '</span> ' : '') +
        esc(r.note) +

      '<td style="padding:6px;text-align:center" class="noprint">' +
        '<button class="ghost" style="padding:3px 7px;font-size:11px" onclick="stockRegDayModal(\'' + r.dIso + '\')">' + (r.hasRecord ? 'Edit' : '+') + '</button>' +

function smdDipCalc() {
  var dipVal = parseFloat(v("smd_dip"));
  if (isNaN(dipVal)) return;
  var fuel = v("smd_fuel") || SREG_FUEL;
  var tanks = (S.tanks || []);
  var t = tanks.find(function(x) { return x.fuel === fuel; }) || (SREG_DATA && SREG_DATA.tank);
  if (t && t.chart && t.chart.length > 0) {
    var l = calcClientDip(t.chart, dipVal);
    if (l != null) {
      document.getElementById("smd_litres").value = l;
    }
  }
}

function calcClientDip(chart, dip) {
  if (dip == null || isNaN(dip) || !chart || !chart.length) return null;
  if (dip <= chart[0].cm) return chart[0].l;
  if (dip >= chart[chart.length - 1].cm) return chart[chart.length - 1].l;
  for (var i = 0; i < chart.length - 1; i++) {
    var c1 = chart[i].cm, c2 = chart[i + 1].cm;
    var l1 = chart[i].l, l2 = chart[i + 1].l;
    if (dip >= c1 && dip <= c2) {
      if (c2 === c1) return l1;
      var frac = (dip - c1) / (c2 - c1);
      return Math.round((l1 + frac * (l2 - l1)) * 10) / 10;
    }
  }
  return null;
}

function srdLiveCalc() {
  var op = parseFloat(v("srd_op_stock"));
  var rec = parseFloat(v("srd_rec")) || 0;
  var cl = parseFloat(v("srd_cl_stock"));
  var sm = parseFloat(v("srd_smeter"));

  var totEl = document.getElementById("srd_lbl_tot");
  var sdipEl = document.getElementById("srd_lbl_sdip");
  var bstockEl = document.getElementById("srd_lbl_bstock");
  var varEl = document.getElementById("srd_lbl_var");

  var tot = !isNaN(op) ? Math.round((op + rec) * 10) / 10 : null;
  if (totEl) totEl.textContent = tot != null ? lt(tot) + " L" : "—";

  var sdip = (tot != null && !isNaN(cl)) ? Math.round((tot - cl) * 10) / 10 : null;
  if (sdipEl) sdipEl.textContent = sdip != null ? lt(sdip) + " L" : "—";

  var bstock = (tot != null && !isNaN(sm)) ? Math.round((tot - sm) * 10) / 10 : null;
  if (bstockEl) bstockEl.textContent = bstock != null ? lt(bstock) + " L" : "—";

  var dvar = (!isNaN(sm) && sdip != null) ? Math.round((sm - sdip) * 10) / 10 : (!isNaN(cl) && bstock != null ? Math.round((cl - bstock) * 10) / 10 : null);
  if (varEl) {
    if (dvar != null) {
      varEl.textContent = (dvar > 0 ? "+" : "") + lt(dvar) + " L";
      varEl.style.color = dvar < 0 ? "var(--due)" : "var(--ok)";
    } else {
      varEl.textContent = "—";
      varEl.style.color = "var(--ink)";
    }
  }
}

function stockRegExportExcel() {
  var ym = SREG_MONTH.split("-"), yr = parseInt(ym[0]), mo = parseInt(ym[1]);
  var daysInMonth = new Date(yr, mo, 0).getDate();
  var tank = (SREG_DATA && SREG_DATA.tank) || null;

  var docTitle = "Daily Stock Register - " + SREG_FUEL;
  var docSub = SREG_MONTH + (S.biz && S.biz.name ? " · " + S.biz.name : "") + (tank ? " · Tank " + tank.name + " (" + tank.capacity + " L)" : "");
  var d = xdoc(docTitle, docSub);

  var head = [
    "Date",
    "Opening Dip (cm)",
    "Opening Stock (L)",
    "Receipt (L)",
    "Challan / TT Bill",
    "Total Stock Available (L)",
    "Closing Dip (cm)",
    "Closing Stock (L)",
    "Sales by Dip (L)",
    "Sales by Meter (L)",
    "Testing (L)",
    "Book Stock (L)",
    "Daily Variation (L)",
    "Cumulative Variation (L)",
    "Cumulative Sales (L)",
    "Variation %",
    "Remarks"
  ];

  var entries = (SREG_DATA && SREG_DATA.entries) || [];
  var byDate = {};
  entries.forEach(function(e) { byDate[e.d] = e; });

  var rows = [];
  var totRec = 0, totDipS = 0, totMeterS = 0, totTest = 0, cumVar = 0, cumS = 0;
  var carryOpStock = null, carryOpDip = null;

  for (var day = 1; day <= daysInMonth; day++) {
    var dayStr = (day < 10 ? "0" : "") + day;
    var dIso = SREG_MONTH + "-" + dayStr;
    var dispD = dayStr + "/" + (mo < 10 ? "0" + mo : mo) + "/" + yr;
    var e = byDate[dIso];

    var opDip = (e && e.opening_dip != null) ? e.opening_dip : carryOpDip;
    var opStock = (e && e.opening_stock != null) ? e.opening_stock : carryOpStock;
    var rec = (e && e.receipt != null) ? e.receipt : 0;
    var ch = (e && e.challan_no) ? e.challan_no : "";
    var totStock = opStock != null ? opStock + rec : "";
    var clDip = (e && e.closing_dip != null) ? e.closing_dip : "";
    var clStock = (e && e.closing_stock != null) ? e.closing_stock : "";
    var sDip = (e && e.sales_dip != null) ? e.sales_dip : "";
    var sMeter = (e && e.sales_meter != null) ? e.sales_meter : "";
    var test = (e && e.testing != null) ? e.testing : 0;
    var bStock = (e && e.book_stock != null) ? e.book_stock : "";
    var dVar = (e && e.variation != null) ? e.variation : "";

    if (rec > 0) totRec += rec;
    if (sDip !== "") totDipS += Number(sDip);
    if (sMeter !== "") {
      totMeterS += Number(sMeter);
      cumS += Number(sMeter);
    }
    if (test > 0) totTest += Number(test);
    if (dVar !== "") cumVar += Number(dVar);

    carryOpStock = clStock !== "" ? clStock : null;
    carryOpDip = clDip !== "" ? clDip : null;

    var curVarPct = (cumS > 0 && dVar !== "") ? ((cumVar / cumS) * 100).toFixed(2) + "%" : "";

    rows.push([
      dispD,
      opDip !== null && opDip !== "" ? Number(opDip) : "",
      opStock !== null && opStock !== "" ? Number(opStock) : "",
      rec > 0 ? Number(rec) : 0,
      ch,
      totStock !== "" ? Number(totStock) : "",
      clDip !== "" ? Number(clDip) : "",
      clStock !== "" ? Number(clStock) : "",
      sDip !== "" ? Number(sDip) : "",
      sMeter !== "" ? Number(sMeter) : "",
      Number(test),
      bStock !== "" ? Number(bStock) : "",
      dVar !== "" ? Number(dVar) : "",
      dVar !== "" ? Math.round(cumVar * 10) / 10 : "",
      cumS > 0 ? Math.round(cumS * 10) / 10 : "",
      curVarPct,
      (e && e.note) ? e.note : ""
    ]);
  }

  // Summary row
  var finalVarPct = totMeterS > 0 ? ((cumVar / totMeterS) * 100).toFixed(2) + "%" : "0.00%";
  rows.push([
    "TOTAL",
    "",
    "",
    totRec,
    "",
    "",
    "",
    "",
    Math.round(totDipS * 10) / 10,
    Math.round(totMeterS * 10) / 10,
    totTest,
    "",
    Math.round(cumVar * 10) / 10,
    Math.round(cumVar * 10) / 10,
    Math.round(cumS * 10) / 10,
    finalVarPct,
    "Net Monthly Variance"
  ]);

  xsec(d, SREG_FUEL.replace(/[^A-Za-z0-9]/g, "_").slice(0, 25), head, rows, "Daily Stock Register");
  saveBytes(xlsxBytes(d), "Daily_Stock_Register_" + SREG_FUEL.replace(/[^A-Za-z0-9]/g, "_") + "_" + SREG_MONTH + ".xlsx", "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
  toast("Downloaded Excel register for " + SREG_FUEL + " (" + SREG_MONTH + ")");
}

  tab = "tanks";

I18R=[
[/^(Morning|Evening|Night) duty · (.*)$/,function(m,l){return trw(m[1],l)+(l==0?" ड्युटी · ":" ड्यूटी · ")+m[2]}],
[/^Testing \((.*)\)$/,function(m,l){return (l==0?"टेस्टिंग (":"टेस्टिंग (")+m[1]+")"}],
[/^Rate \(₹\/(.*)\)$/,function(m,l){return (l==0?"दर (₹/":"रेट (₹/")+m[1]+")"}],
[/^(.*) (L|kg|kWh) sold = (.*)$/,function(m,l){return m[1]+" "+m[2]+(l==0?" विक्री = ":" बिक्री = ")+m[3]}],
[/^(Short|Excess) (.*)$/,function(m,l){return trw(m[1],l)+" "+m[2]}],
[/^Credit available: (.*)$/,function(m,l){return (l==0?"उपलब्ध क्रेडिट: ":"उपलब्ध क्रेडिट: ")+m[1]}],
[/^This is more than the customer's available credit \((.*)\)\. It will be sent to a manager for approval\. Continue\?$/,function(m,l){return l==0?"ही रक्कम ग्राहकाच्या उपलब्ध क्रेडिटपेक्षा जास्त आहे ("+m[1]+"). ती व्यवस्थापकाच्या मंजुरीसाठी पाठवली जाईल. पुढे जायचे?":"यह राशि ग्राहक के उपलब्ध क्रेडिट ("+m[1]+") से ज्यादा है। इसे मैनेजर की मंजूरी के लिए भेजा जाएगा। आगे बढ़ें?"}],
[/^Note: (.*)$/,function(m,l){return (l==0?"टीप: ":"नोट: ")+m[1]}],
[/^(\d+) duty not yet closed, not counted$/,function(m,l){return l==0?m[1]+" ड्युटी अजून बंद नाही, मोजलेली नाही":m[1]+" ड्यूटी अभी बंद नहीं, गिनी नहीं गई"}],
[/^(.*) waived$/,function(m,l){return m[1]+(l==0?" माफ":" माफ")}],
[/^Enter the closing reading for (.*)\.$/,function(m,l){return l==0?m[1]+" साठी शेवटचे रीडिंग टाका.":m[1]+" के लिए अंतिम रीडिंग डालें।"}],
[/^Closing is less than opening for (.*)\.$/,function(m,l){return l==0?m[1]+" चे शेवटचे रीडिंग सुरुवातीच्या रीडिंगपेक्षा कमी आहे.":m[1]+" का अंतिम रीडिंग शुरुआती रीडिंग से कम है।"}],
[/^Testing litres are more than the fuel dispensed on (.*)\.$/,function(m,l){return l==0?m[1]+" वर टेस्टिंग प्रमाण दिलेल्या इंधनापेक्षा जास्त आहे.":m[1]+" पर टेस्टिंग मात्रा दिए गए ईंधन से ज्यादा है।"}],
[/^Only (.*) of (.*) in stock\.$/,function(m,l){return l==0?m[2]+" चा फक्त "+m[1]+" साठा आहे.":m[2]+" का केवल "+m[1]+" स्टॉक है।"}],
[/^Enter an amount above zero for every expense\.$/,function(m,l){return l==0?"प्रत्येक खर्चासाठी शून्यापेक्षा जास्त रक्कम टाका.":"हर खर्च के लिए शून्य से अधिक राशि डालें।"}],
[/^(.*(Morning|Evening|Night) × \d+.*)$/,function(m,l){return m[1].replace(/Morning|Evening|Night/g,function(w){return trw(w,l)})}]];
function trw(w,l){var e=I18N[w];return e?e[l]:w}
function trText(s){var l=LANG=="mr"?0:1,k=s.trim();if(!k||!/[A-Za-z]/.test(k))return null;var e=I18N[k];if(e)return s.replace(k,e[l]);
for(var i=0;i<I18R.length;i++){var m=k.match(I18R[i][0]);if(m)return s.replace(k,I18R[i][1](m,l))}return null}
function trAll(){if(LANG=="en")return;["app","sheet"].forEach(function(id){var root=document.getElementById(id);if(!root)return;
var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),n,list=[];while((n=w.nextNode()))list.push(n);
list.forEach(function(n){var p=n.parentNode,tag=p&&p.tagName;if(tag=="OPTION"&&!p.hasAttribute("value"))return;if(tag=="TEXTAREA"||tag=="SCRIPT"||tag=="STYLE")return;var t=trText(n.nodeValue);if(t!=null&&t!==n.nodeValue)n.nodeValue=t});
[].forEach.call(root.querySelectorAll("[placeholder]"),function(e){var t=trText(e.getAttribute("placeholder"));if(t!=null)e.setAttribute("placeholder",t)})})}
function startI18n(){if(I18||!window.MutationObserver)return;var obs=function(){["app","sheet"].forEach(function(id){var e=document.getElementById(id);if(e)I18.observe(e,{childList:true,subtree:true,characterData:true})})};
I18=new MutationObserver(function(){if(LANG=="en")return;I18.disconnect();trAll();obs()});obs()}

function authView(setup){var h='<h1 style="font-size:22px;color:var(--ink);font-weight:800;margin:20px 0 4px">Petrol pump manager</h1><div class="sub">'+(setup?'Create the owner account to get started.':'Log in with your mobile number and password.')+'</div>'+(setup?'<label>Your name<input id="a0"></label>':'')+'<label>Mobile number<input id="a1" inputmode="tel" autocomplete="username"></label><label>Password<input id="a2" type="password" autocomplete="'+(setup?'new-password':'current-password')+'"></label><div class="err" id="er"></div><button style="width:100%;margin-top:6px" onclick="doAuth('+(setup?1:0)+')">'+(setup?'Create owner account':'Log in')+'</button>';
document.getElementById("app").innerHTML=h;document.getElementById("a2").onkeydown=function(e){if(e.key=="Enter")doAuth(setup?1:0)}}

function logout(){try{localStorage.removeItem("petrol_auth_token")}catch(e){}AUTH_TOKEN="";api("POST","/api/logout").then(function(){location.reload()}).catch(function(){location.reload()})}

function saveDuty(force){var a=parseFloat(v("d4")),fu=v("d5"),lt=parseFloat(v("d6")),b={cust_id:v("d1"),fuel:fu,litres:fu?lt:"",n:v("d3"),a:a,veh:v("d2"),force:!!force};
if(!b.cust_id)return er("Choose a customer.");if(fu&&!(lt>0))return er("Enter the litres.");if(!fu&&!b.n)return er("Describe the item.");if(!(a>0))return er("Enter an amount above zero.");
var c=CL.filter(function(x){return x.id==b.cust_id})[0],go=function(){api("POST","/api/credit-sales",b).then(function(){loadCredit()}).catch(function(e){er(e.error||"Could not save. Check your connection.")})};
if(c&&a>c.available)return ask("This is more than the customer's available credit ("+inr(c.available)+"). It will be sent to a manager for approval. Continue?",go);go()}
